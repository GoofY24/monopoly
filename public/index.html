<!DOCTYPE html>
<html lang="ka">
<head>
<script src="/socket.io/socket.io.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>მონოპოლია</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,"Noto Sans Georgian",sans-serif;
  background:#07070d;color:#e8e8f2;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit;font-weight:inherit}
button:disabled{cursor:not-allowed}

/* ================= START ================= */
.start{position:fixed;inset:0;z-index:300;overflow-y:auto;
  background:radial-gradient(ellipse at 50% 10%,rgba(139,92,246,.25) 0%,transparent 55%),
    radial-gradient(ellipse at 50% 90%,rgba(236,72,153,.15) 0%,transparent 55%),#07070d;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;gap:22px}
.start h1{font-size:clamp(34px,10vw,52px);margin:0;font-weight:900;letter-spacing:-.03em;
  background:linear-gradient(135deg,#a78bfa 0%,#f0abfc 45%,#fbbf24 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;text-align:center;filter:drop-shadow(0 6px 30px rgba(167,139,250,.35))}
.start .sub{color:#6b7280;font-size:10px;letter-spacing:.4em;text-transform:uppercase;
  margin-top:-10px;font-weight:700}
.setup{display:flex;flex-direction:column;gap:9px;width:100%;max-width:340px}
.prow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);
  padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.07);transition:.2s}
.prow:focus-within{border-color:rgba(167,139,250,.5);background:rgba(167,139,250,.06)}
.prow input{flex:1;background:transparent;border:none;color:#f0f0f8;font-size:15px;
  outline:none;min-width:0;font-weight:700;letter-spacing:-.01em}
.prow input::placeholder{color:#4b5563;font-weight:500}
.start-row{display:flex;gap:10px;width:100%;max-width:340px}
.btn{padding:14px 18px;font-size:14px;font-weight:800;border-radius:14px;color:#fff;
  transition:transform .1s,filter .1s;letter-spacing:.01em;width:100%;
  background:linear-gradient(180deg,#8b5cf6,#7c3aed);
  box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 2px 6px rgba(0,0,0,.4)}
.btn:active:not(:disabled){transform:translateY(1px);filter:brightness(1.12)}
.btn:disabled{opacity:.28;filter:grayscale(.6)}
.btn.green{background:linear-gradient(180deg,#10b981,#059669)}
.btn.orange{background:linear-gradient(180deg,#f59e0b,#d97706)}
.btn.red{background:linear-gradient(180deg,#ef4444,#dc2626)}
.btn.gray{background:linear-gradient(180deg,#374151,#1f2937)}

.color-label{font-size:10px;color:#6b7280;letter-spacing:.3em;text-transform:uppercase;
  font-weight:700;text-align:center;margin-bottom:-4px}
.color-picker{display:flex;gap:14px;justify-content:center;width:100%;max-width:340px;
  padding:4px 0}
.color-opt{width:52px;height:52px;border-radius:50%;background:var(--c);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:20px;color:rgba(255,255,255,.95);
  border:3px solid transparent;transition:transform .18s,border-color .18s,box-shadow .18s;
  box-shadow:0 3px 12px rgba(0,0,0,.5),inset 0 -4px 8px rgba(0,0,0,.2)}
.color-opt.selected{border-color:#fff;transform:scale(1.12);
  box-shadow:0 0 24px var(--c),0 3px 12px rgba(0,0,0,.5)}
.color-opt:active{transform:scale(.95)}

.lobby-status{
  color:#a78bfa;font-size:14px;font-weight:700;text-align:center;
  background:rgba(167,139,250,.1);padding:12px;border-radius:12px;
  border:1px solid rgba(167,139,250,.3);display:none;width:100%;max-width:340px;
}

/* ================= BOARD ================= */
.game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:4px}
.board{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);
  width:min(540px,100vw - 8px,100vh - 8px);height:min(540px,100vw - 8px,100vh - 8px);
  background:radial-gradient(ellipse at 50% 50%,rgba(139,92,246,.08) 0%,transparent 60%),#0d0d17;
  padding:3px;gap:1.5px;border-radius:10px;
  box-shadow:0 0 100px rgba(139,92,246,.15),inset 0 0 0 1px rgba(255,255,255,.06);
  container-type:size;container-name:board}

.tile{position:relative;background:#181824;overflow:hidden;border-radius:3px;
  display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  transition:background .3s,box-shadow .3s;
  cursor:pointer}
.tile:active{filter:brightness(1.15)}
.tile[data-side="top"]{flex-direction:column-reverse}
.tile[data-side="left"]{transform:rotate(90deg)}
.tile[data-side="right"]{transform:rotate(-90deg)}

.tile .band{flex-shrink:0;width:100%;height:24%;background:var(--band,#555);
  display:flex;align-items:center;justify-content:center;gap:2px;padding:1px 3px;
  overflow:hidden;position:relative}
.tile .info{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1px 2px;gap:1px;min-width:0;min-height:0;overflow:hidden}
.tile .name{font-size:1.75cqmin;font-weight:800;line-height:1.02;text-align:center;
  color:#f0f0f8;letter-spacing:-.01em;width:100%;word-break:break-word;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.tile .name.xs{font-size:1.55cqmin}
.tile .name.sm{font-size:1.68cqmin}
.tile .price{font-size:1.45cqmin;font-weight:800;color:#fbbf24;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:0}
.tile .icon{font-size:5.2cqmin;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile.corner{background:linear-gradient(160deg,#1c1c2a,#141420)}
.tile.corner .icon{font-size:6.8cqmin}
.tile.corner .name{font-size:2.05cqmin;font-weight:900;color:#c4b5fd;-webkit-line-clamp:2}
.tile.corner .info{gap:2px}

.mono-badge{position:absolute;bottom:1px;right:1px;font-size:1.4cqmin;background:#fbbf24;color:#000;font-weight:900;padding:1px 2px;border-radius:2px;z-index:6;line-height:1}

.owner-ring{position:absolute;inset:0;border-radius:3px;pointer-events:none;z-index:5;
  border:3px solid transparent;
  transition:border-color .3s,box-shadow .3s,background .3s}
.tile.owned .info{position:relative;z-index:1}

.tokens{position:absolute;top:3%;left:3%;right:3%;bottom:3%;z-index:7;
  display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:flex-start;
  gap:1.5px;pointer-events:none;align-content:flex-start}
.token{width:3.4cqmin;height:3.4cqmin;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;
  font-size:1.9cqmin;font-weight:900;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.9);
  box-shadow:0 1px 4px rgba(0,0,0,.7),0 0 0 .5px rgba(0,0,0,.5);
  transition:transform .2s ease-out}

.house-svg{height:90%;width:auto;max-width:22%;flex-shrink:0;
  filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.7));transition:transform .25s}
.house-svg.hotel{max-width:55%;height:95%}
@keyframes houseIn{
  0%{transform:scale(0) rotate(-20deg);opacity:0}
  60%{transform:scale(1.15) rotate(3deg);opacity:1}
  100%{transform:scale(1) rotate(0);opacity:1}}
.house-svg.new{animation:houseIn .35s cubic-bezier(.34,1.56,.64,1)}

/* ================= CENTER ================= */
.center{grid-row:2/11;grid-column:2/11;
  background:radial-gradient(ellipse at 50% 0%,rgba(139,92,246,.18) 0%,transparent 55%),
    radial-gradient(ellipse at 50% 100%,rgba(236,72,153,.1) 0%,transparent 55%),
    linear-gradient(180deg,#0c0c16 0%,#08080f 100%);
  border-radius:8px;display:flex;flex-direction:column;padding:2.2cqmin 3cqmin;gap:1.6cqmin;
  position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 0 80px rgba(0,0,0,.7)}
.center::before{content:'MONOPOLY';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) rotate(-18deg);font-size:13cqmin;font-weight:900;
  color:rgba(167,139,250,.04);letter-spacing:.35em;pointer-events:none;white-space:nowrap;
  font-family:Georgia,serif;font-style:italic}

/* ==== TIMER ==== */
.timer-bar{
  display:flex;align-items:center;justify-content:center;gap:1cqmin;
  background:rgba(139,92,246,.15);
  padding:1cqmin 2cqmin;border-radius:1.2cqmin;
  font-size:2.4cqmin;font-weight:900;color:#c4b5fd;
  border:1px solid rgba(167,139,250,.3);
  font-variant-numeric:tabular-nums;
  letter-spacing:.06em;
  z-index:1;flex-shrink:0;
  transition:all .4s;width:100%;
}
.timer-bar.warning{
  background:rgba(239,68,68,.2);color:#fca5a5;
  border-color:rgba(239,68,68,.55);
  animation:pulseRed 1s ease-in-out infinite;
}
@keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.55}}

.players{display:grid;grid-template-columns:repeat(2,1fr);gap:1cqmin;z-index:1;flex-shrink:0}
.pcard{display:flex;align-items:center;gap:1cqmin;padding:1cqmin 1.3cqmin;
  background:rgba(255,255,255,.04);border-radius:1.6cqmin;font-size:2.3cqmin;
  border:1px solid rgba(255,255,255,.07);transition:all .3s;min-width:0;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:.5cqmin;
  background:var(--pc,#64748b);transition:width .2s}
.pcard.active{border-color:rgba(167,139,250,.6);background:rgba(167,139,250,.14);
  box-shadow:0 0 18px rgba(167,139,250,.3)}
.pcard.active::before{width:.9cqmin}
.pcard.dead{opacity:.3;filter:grayscale(.9)}
.pcard .pd{width:2.3cqmin;height:2.3cqmin;border-radius:50%;flex-shrink:0;
  border:1.5px solid rgba(255,255,255,.8);
  display:flex;align-items:center;justify-content:center;
  font-size:1.5cqmin;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.pcard .pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-weight:700;font-size:2.3cqmin;line-height:1;color:#f0f0f8;letter-spacing:-.01em}
.pcard .pm{font-weight:800;color:#fbbf24;font-size:2.3cqmin;
  font-variant-numeric:tabular-nums;line-height:1}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.8cqmin;z-index:1;min-height:0}
.dice-pair{display:flex;gap:3cqmin}
.dice{width:12cqmin;height:12cqmin;background:linear-gradient(145deg,#ffffff,#d4d4d8);
  border-radius:2cqmin;
  box-shadow:0 .6cqmin 1.2cqmin rgba(0,0,0,.6),
    inset 0 -.35cqmin 0 rgba(0,0,0,.16),inset 0 .45cqmin 0 rgba(255,255,255,.9);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:1.4cqmin;gap:.35cqmin}
.dice.shake{animation:shake .7s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  0%{transform:rotate(0) scale(1)}
  15%{transform:rotate(-16deg) scale(.9) translateY(-2px)}
  30%{transform:rotate(20deg) scale(1.1) translateY(-5px)}
  45%{transform:rotate(-24deg) scale(.94)}
  60%{transform:rotate(16deg) scale(1.06) translateY(-3px)}
  80%{transform:rotate(-8deg) scale(1.01)}
  100%{transform:rotate(0) scale(1)}}
.cell{border-radius:50%;background:transparent;transition:background .06s}
.cell.on{background:radial-gradient(circle at 35% 35%,#1f1f2a,#0a0a12);
  box-shadow:inset 0 .15cqmin .3cqmin rgba(0,0,0,.75)}

.turn{font-size:2.6cqmin;font-weight:700;text-align:center;min-height:3cqmin;
  z-index:1;line-height:1.15;padding:0 3%;color:#9ca3af;letter-spacing:-.01em}
.turn b{color:#c4b5fd;font-weight:900}
.turn .hint{display:block;font-size:1.6cqmin;color:#4b5563;font-weight:500;margin-top:2px}

.actions{display:flex;gap:1cqmin;z-index:1;width:100%;flex-shrink:0}
.actions .btn{padding:1.8cqmin 1cqmin;font-size:2.3cqmin;border-radius:1.5cqmin;
  font-weight:800;letter-spacing:-.01em}

.log{font-size:1.85cqmin;color:#6b7280;text-align:center;height:4.4cqmin;
  overflow:hidden;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;
  line-height:1.3;padding:0 3%;flex-shrink:0}
.log div{animation:fi .3s ease-out;opacity:.65}
.log div:last-child{opacity:1;color:#9ca3af;font-weight:700}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

/* ================= MODAL ================= */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;
  align-items:center;justify-content:center;z-index:500;padding:20px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fi .2s}
.modal.hidden{display:none}
.mcard{background:linear-gradient(160deg,#1a1a26,#0d0d16);border-radius:22px;
  padding:24px 20px;max-width:400px;width:100%;border:1px solid rgba(255,255,255,.09);
  box-shadow:0 30px 80px rgba(0,0,0,.9),0 0 60px rgba(139,92,246,.2);
  text-align:center;animation:pop .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;max-height:88vh;overflow-y:auto}
.mcard::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(167,139,250,.6),transparent)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.mcard h2{margin:0 0 4px;font-size:20px;color:#c4b5fd;font-weight:900;letter-spacing:-.02em}
.mcard .cat{font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:.25em;
  margin-bottom:12px;font-weight:700}
.mcard .icon-big{font-size:56px;line-height:1;margin:8px 0;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.8))}
.mcard p{margin:8px 0;color:#cbd5e1;font-size:14px;line-height:1.5}
.mcard .price{font-size:36px;font-weight:900;color:#fbbf24;margin:10px 0 2px;
  letter-spacing:-.03em;text-shadow:0 0 40px rgba(251,191,36,.5)}
.mcard .balance{font-size:12px;color:#9ca3af;margin-bottom:6px}
.mcard .actions{display:flex;gap:8px;margin-top:18px}
.mcard .actions .btn{padding:13px 12px;font-size:14px;border-radius:12px;flex:1}
.mcard.chance-card{background:linear-gradient(160deg,#4c1d95,#2e1065)}
.mcard.chance-card h2{color:#fbbf24}
.mcard.chest-card{background:linear-gradient(160deg,#155e75,#0c4a6e)}
.mcard.chest-card h2{color:#fbbf24}
.mcard.gameover{background:linear-gradient(160deg,#1a1a26,#0d0d16)}
.mcard.gameover h2{color:#fbbf24;font-size:24px}
.mcard.upgrade-card{background:linear-gradient(160deg,#065f46,#064e3b)}
.mcard.upgrade-card h2{color:#6ee7b7}
.mcard.tile-info{background:linear-gradient(160deg,#15152a,#0a0a18)}
.mcard .color-bar{width:70%;height:8px;margin:0 auto 12px;border-radius:4px;
  box-shadow:0 0 24px currentColor}

.rent-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;background:rgba(0,0,0,.35);border-radius:12px;margin-top:6px;
  border:1px solid rgba(255,255,255,.06)}
.rent-row .lbl{font-size:11px;color:#9ca3af;text-align:left;line-height:1.3;font-weight:600}
.rent-row .lbl b{display:block;color:#f0f0f8;font-size:13px;font-weight:800;margin-top:2px}
.rent-row .val{font-size:16px;font-weight:900;color:#fbbf24;white-space:nowrap;letter-spacing:-.02em}

.rent-levels{
  margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.08);
  text-align:left}
.rent-levels-title{
  font-size:10px;color:#6b7280;text-transform:uppercase;
  letter-spacing:.25em;font-weight:700;margin-bottom:6px;text-align:center}
.rent-level{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;font-size:12.5px;color:#9ca3af;
  border-radius:10px;margin-top:4px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.04);
  transition:all .25s}
.rent-level.active{
  background:linear-gradient(90deg,rgba(251,191,36,.18),rgba(251,191,36,.06));
  border-color:rgba(251,191,36,.5);
  color:#fef3c7;font-weight:700;
  box-shadow:0 0 16px rgba(251,191,36,.15)}
.rent-level.active b{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.7);font-size:14px}
.rent-level b{color:#cbd5e1;font-weight:800;font-variant-numeric:tabular-nums}
.rent-level .rlevel-icon{margin-right:6px;font-size:14px}

.owner-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800;
  margin:6px 0}
.owner-chip .dot{width:8px;height:8px;border-radius:50%}

/* ==== STATS MODAL ==== */
.stat-player{padding:12px 14px;background:rgba(255,255,255,.04);border-radius:14px;
  margin-top:10px;border:1px solid rgba(255,255,255,.08);text-align:left}
.stat-player.winner{border-color:rgba(251,191,36,.6);
  background:linear-gradient(160deg,rgba(251,191,36,.15),rgba(251,191,36,.03));
  box-shadow:0 0 20px rgba(251,191,36,.2)}
.stat-name{font-size:15px;font-weight:900;color:#f0f0f8;margin-bottom:8px;
  display:flex;align-items:center;gap:8px}
.stat-name .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.stat-row{display:flex;justify-content:space-between;align-items:center;
  padding:6px 10px;background:rgba(0,0,0,.3);border-radius:8px;margin-top:4px;
  border:1px solid rgba(255,255,255,.05);font-size:12.5px}
.stat-row .lbl{color:#9ca3af;font-weight:600}
.stat-row .val{font-weight:900;color:#fbbf24;font-variant-numeric:tabular-nums}
.stat-row.total{background:linear-gradient(90deg,rgba(251,191,36,.14),rgba(251,191,36,.03));
  border-color:rgba(251,191,36,.35)}
.stat-row.total .val{font-size:16px}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);
  background:rgba(26,26,38,.98);border:1px solid rgba(167,139,250,.45);color:#f0f0f8;
  padding:11px 20px;border-radius:14px;font-size:13px;font-weight:700;z-index:600;
  box-shadow:0 12px 40px rgba(0,0,0,.8);pointer-events:none;max-width:85vw;
  text-align:center;animation:fi .25s}

.money-particle{
  position:fixed;z-index:9999;pointer-events:none;
  font-weight:900;font-size:20px;
  animation:flyUp 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}
@keyframes flyUp{
  0%{opacity:1;transform:translate(-50%,-50%) scale(0.6)}
  50%{transform:translate(-50%,-120%) scale(1.3)}
  100%{opacity:0;transform:translate(-50%,-200%) scale(1)}
}
</style>
</head>
<body>

<div class="start" id="startScreen">
  <div style="text-align:center">
    <h1>მონოპოლია</h1>
    <div class="sub">40 უჯრა · 20 წუთი · ონლაინ მულტიპლეერი</div>
  </div>
  
  <div class="setup">
    <div class="prow">
      <input type="text" id="usernameInput" placeholder="შეიყვანეთ ნიკნეიმი" maxlength="14" value="მოთამაშე">
    </div>
    <div class="prow">
      <input type="text" id="roomIdInput" placeholder="ოთახის ID (მაგ: room1)" maxlength="15" value="room1">
    </div>
  </div>

  <div class="color-label">აირჩიე ფერი</div>
  <div class="color-picker" id="colorPicker">
    <div class="color-opt selected" data-color="#ef4444" style="--c:#ef4444">1</div>
    <div class="color-opt" data-color="#3b82f6" style="--c:#3b82f6">2</div>
    <div class="color-opt" data-color="#22c55e" style="--c:#22c55e">3</div>
    <div class="color-opt" data-color="#f59e0b" style="--c:#f59e0b">4</div>
  </div>

class SoundEffects {
  constructor(){ this.ctx = null; }
  init(){
    if(!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if(AudioCtx) this.ctx = new AudioCtx();
    }
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playTone(freq, type, duration, gainVal=0.1){
    try{
      this.init();
      if(!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    }catch(e){}
  }
  roll(){
    for(let i=0; i<5; i++){
      setTimeout(()=> this.playTone(150 + Math.random()*200, 'triangle', 0.08, 0.15), i*70);
    }
  }
  money(){
    this.playTone(800, 'sine', 0.1, 0.1);
    setTimeout(()=> this.playTone(1200, 'sine', 0.2, 0.15), 80);
  }
  buy(){
    this.playTone(523.25, 'sine', 0.12, 0.1);
    setTimeout(()=> this.playTone(659.25, 'sine', 0.12, 0.1), 100);
    setTimeout(()=> this.playTone(783.99, 'sine', 0.2, 0.1), 200);
  }
  monopoly(){
    const notes = [400, 500, 600, 800, 1000];
    notes.forEach((freq, idx)=>{
      setTimeout(()=> this.playTone(freq, 'square', 0.15, 0.1), idx*90);
    });
  }
  bankrupt(){
    this.playTone(300, 'sawtooth', 0.2, 0.15);
    setTimeout(()=> this.playTone(200, 'sawtooth', 0.4, 0.15), 200);
  }
  victory(){

      setTimeout(()=> this.playTone(f, 'sine', 0.3, 0.12), i * 130);
    });

}

function formatTime(sec){

// STATE SYNC - მთავარი მექანიზმი
socket.on('game_sync', ({ state }) => {
  if(!state) return;
  const wasGameOver = S ? S.gameOver : false;
  isRemoteUpdate = true;
  S = state;
  renderAll();
  isRemoteUpdate = false;
  if (state.gameOver && !wasGameOver && !statsShown) {
    showStatsModal('bankrupt');
  }
});

// კამათლის ანიმაციის სინქრონიზაცია

  if(!S) return;
  await animateDice(d1, d2);
  S.dice = [d1, d2];
  S.lastRoll = d1 + d2;
  renderDice();
});

// ტაიმერის სინქრონიზაცია
socket.on('timer_tick', ({ timeLeft }) => {
  if(!S) return;
  S.timeLeft = timeLeft;
  renderTimer();
});

socket.on('time_up', () => {
  if(!S || S.gameOver) return;
  endGame('time_up');
});

// მოწინააღმდეგის გასვლა
socket.on('game_over', ({ winner, reason }) => {
  if(!S) return;
  if(S.gameOver) return;
  if(winner){
    const idx = S.players.findIndex(p => p.name === winner.username);
    if(idx >= 0) {
      S.players.forEach((p, i) => { if(i !== idx) p.dead = true; });
    }
  }
  endGame(reason === 'all_opponents_disconnected' ? 'disconnect' : 'bankrupt');
});

socket.on('player_left', () => {
  toast('მოწინააღმდეგე გავიდა');
});

socket.on('error_message', (msg) => {

});

    el.dataset.side = g.side; el.dataset.i = i;
    el.style.gridRow = g.r; el.style.gridColumn = g.c;
    el.id = 'tile-'+i;

    if(t.color){
      const band = document.createElement('div');
      band.className = 'band'; band.style.setProperty('--band', t.color); band.id = 'band-'+i;
      el.appendChild(band);
    } else if(!g.corner){
      const band = document.createElement('div');
      band.className = 'band';
      const c = t.type==='rail'?'#64748b':t.type==='util'?'#0891b2':t.type==='tax'?'#dc2626':
        t.type==='chance'?'#8b5cf6':t.type==='chest'?'#0891b2':'#475569';
      band.style.setProperty('--band', c); band.id = 'band-'+i;
      el.appendChild(band);
    }

    const info = document.createElement('div');
    info.className = 'info';
    const nameLen = t.name.length;
    let sizeClass = '';
    if(nameLen > 9) sizeClass = 'xs'; else if(nameLen > 6) sizeClass = 'sm';
    info.innerHTML = `
      ${t.type!=='prop' && !g.corner ? `<div class="icon">${t.icon||''}</div>` : ''}
      ${g.corner ? `<div class="icon">${t.icon||''}</div>` : ''}
      <div class="name ${sizeClass}">${t.name}</div>
      ${t.price ? `<div class="price">${t.price}₾</div>` : ''}
      ${t.amount ? `<div class="price">${t.amount}₾</div>` : ''}
    `;
    el.appendChild(info);

    const ring = document.createElement('div');
    ring.className = 'owner-ring'; ring.id = 'ring-'+i;
    el.appendChild(ring);

    const tokens = document.createElement('div');
    tokens.className = 'tokens'; tokens.id = 'tokens-'+i;
    el.appendChild(tokens);

    attachLongPress(el, i);
    board.appendChild(el);
  });

  $('rollBtn').addEventListener('click', onRoll);
  $('endBtn').addEventListener('click', onEndTurn);
}

let lpTimer = null, lpX = 0, lpY = 0;

function attachLongPress(el, idx){
  el.addEventListener('contextmenu', e => e.preventDefault());

  el.addEventListener('pointerdown', (e)=>{
    if(!S || S.gameOver) return;
    if(e.button !== undefined && e.button !== 0) return;
    lpX = e.clientX; lpY = e.clientY;
    if(lpTimer) clearTimeout(lpTimer);
    lpTimer = setTimeout(()=>{
      lpTimer = null;
      if(navigator.vibrate) navigator.vibrate(15);
      showTileInfo(idx);
    }, 450);
  });

  el.addEventListener('pointerup', ()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; } });
  el.addEventListener('pointercancel', ()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; } });
  el.addEventListener('pointerleave', ()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer = null; } });
  el.addEventListener('pointermove', (e)=>{
    if(!lpTimer) return;
    const dx = Math.abs(e.clientX - lpX);
    const dy = Math.abs(e.clientY - lpY);
    if(dx > 10 || dy > 10){ clearTimeout(lpTimer); lpTimer = null; }
  });
}

function checkMonopoly(group, ownerId) {
  if(!group || ownerId == null) return false;
  const groupTiles = S.tiles.filter(x => x.type==='prop' && x.group === group);
  return groupTiles.every(x => x.owner === ownerId);
}

/* ================= showTileInfo ================= */
function showTileInfo(idx){
  const t = S.tiles[idx];
  const owner = t.owner != null ? S.players[t.owner] : null;
  const currentP = S.players[S.current];

  let html = '';
  html += `<h2>${t.name}</h2>`;
  html += `<div class="cat">${tileTypeLabel(t)}</div>`;
  if(t.color) html += `<div class="color-bar" style="background:${t.color};color:${t.color}"></div>`;
  else if(t.icon) html += `<div class="icon-big" style="font-size:44px">${t.icon}</div>`;

  if(owner){
    const isMono = checkMonopoly(t.group, owner.id);
    html += `<div class="owner-chip" style="background:${owner.color}22;border:1px solid ${owner.color}66;color:${owner.color}">
      <span class="dot" style="background:${owner.color};box-shadow:0 0 8px ${owner.color}"></span>
      ${owner.name}${owner.id === currentP.id ? ' (შენ)' : ''} ${isMono ? '👑 [მონოპოლია]' : ''}
    </div>`;
  } else if(['prop','rail','util'].includes(t.type)){
    html += `<div class="owner-chip" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#9ca3af">
      <span class="dot" style="background:#6b7280"></span> უპატრონო
    </div>`;
  }

  if(t.price) html += `<div class="price">${t.price}₾</div>`;
  if(t.amount) html += `<div class="price">${t.amount}₾</div>`;

  if(t.type === 'prop'){
    const ownsAll = checkMonopoly(t.group, owner ? owner.id : null);
    const levels = [
      {icon:'', label:'ცარიელი ნაკვეთი', val:t.rent[0], key:'e'},
      {icon:'⭐', label:'მონოპოლია (×2 გაორმაგებული)', val:t.rent[0]*2, key:'m'},
      {icon:'🏠', label:'1 სახლი', val:t.rent[1], key:'h1'},
      {icon:'🏠', label:'2 სახლი', val:t.rent[2], key:'h2'},
      {icon:'🏠', label:'3 სახლი', val:t.rent[3], key:'h3'},
      {icon:'🏠', label:'4 სახლი', val:t.rent[4], key:'h4'},
      {icon:'🏨', label:'სასტუმრო', val:t.rent[5], key:'hh'},
    ];
    html += `<div class="rent-levels"><div class="rent-levels-title">ქირის ცხრილი</div>`;
    levels.forEach(l=>{
      let active = false;
      if(owner){
        if(t.houses === 0){
          if(l.key === 'm' && ownsAll) active = true;
          if(l.key === 'e' && !ownsAll) active = true;
        } else if(t.houses === 1 && l.key === 'h1') active = true;
        else if(t.houses === 2 && l.key === 'h2') active = true;
        else if(t.houses === 3 && l.key === 'h3') active = true;
        else if(t.houses === 4 && l.key === 'h4') active = true;
        else if(t.houses === 5 && l.key === 'hh') active = true;
      }
      html += `<div class="rent-level${active ? ' active' : ''}">
        <span>${l.icon ? `<span class="rlevel-icon">${l.icon}</span>` : ''}${l.label}</span>
        <b>${l.val}₾</b>
      </div>`;
    });
    html += `</div>`;
  }

  if(t.type === 'rail'){
    html += `<div class="rent-levels"><div class="rent-levels-title">ქირა (რაოდენობით)</div>`;
    const railCount = owner ? S.tiles.filter(x => x.type==='rail' && x.owner === owner.id).length : 0;
    [
      {label:'1 რკინიგზა', val:25, n:1},
      {label:'2 რკინიგზა', val:50, n:2},
      {label:'3 რკინიგზა', val:100, n:3},
      {label:'4 რკინიგზა', val:200, n:4},
    ].forEach(r=>{
      const active = railCount === r.n;
      html += `<div class="rent-level${active ? ' active' : ''}">
        <span>${r.label}</span><b>${r.val}₾</b>
      </div>`;
    });
    html += `</div>`;
  }

  if(t.type === 'util'){
    html += `<div class="rent-levels"><div class="rent-levels-title">ქირა (კამათლის ჯამი ×)</div>`;
    const utilCount = owner ? S.tiles.filter(x => x.type==='util' && x.owner === owner.id).length : 0;
    [
      {label:'1 კომუნალური', val:'4× 🎲', n:1},
      {label:'2 კომუნალური', val:'10× 🎲', n:2},
    ].forEach(r=>{
      const active = utilCount === r.n;
      html += `<div class="rent-level${active ? ' active' : ''}">
        <span>${r.label}</span><b>${r.val}</b>
      </div>`;
    });
    html += `</div>`;
  }

  if(t.type === 'tax'){
    html += `<div class="rent-levels">
      <div class="rent-level active"><span>💰 გადასახადი</span><b>${t.amount}₾</b></div>
    </div>`;
  }

  if(t.type === 'chance') html += `<div style="font-size:12px;color:#9ca3af;margin-top:10px">აიღე ბარათი ❓</div>`;
  if(t.type === 'chest') html += `<div style="font-size:12px;color:#9ca3af;margin-top:10px">აიღე ბარათი 📦</div>`;
  if(t.type === 'gotojail') html += `<div style="font-size:12px;color:#fbbf24;margin-top:10px">გადადი ციხეში 👮</div>`;
  if(t.type === 'parking') html += `<div style="font-size:12px;color:#9ca3af;margin-top:10px">დასვენება — არაფერი ხდება 🅿️</div>`;
  if(t.type === 'go') html += `<div style="font-size:12px;color:#22c55e;margin-top:10px">გაიარე → +${GO_BONUS}₾</div>`;
  if(t.type === 'jail') html += `<div style="font-size:12px;color:#9ca3af;margin-top:10px">უბრალოდ სტუმრობ ციხეს</div>`;

  let canSellHouse = false;
  if(owner && owner.id === currentP.id && t.type === 'prop' && t.houses > 0){
    canSellHouse = true;
  }

  html += `<div class="actions">`;
  if(canSellHouse){
    const sp = Math.floor(HOUSE_COST[t.group]/2);
    html += `<button class="btn orange" id="sellHBtn">გაყიდე (+${sp}₾)</button>`;
  }
  html += `<button class="btn gray" id="closeInfoBtn">დახურვა</button>`;
  html += `</div>`;

  const modalCard = $('modalCard');
  modalCard.className = 'mcard tile-info';
  modalCard.innerHTML = html;
  $('modal').classList.remove('hidden');

  if(canSellHouse){
    $('sellHBtn').onclick = ()=>{
      sellHouse(idx);
      emitSync();
      renderAll();
      closeModal();
      toast('სახლი გაიყიდა ✓');
    };
  }
  $('closeInfoBtn').onclick = closeModal;
}

function tileTypeLabel(t){
  switch(t.type){
    case 'prop': return 'ქუჩა';
    case 'rail': return 'რკინიგზა';
    case 'util': return 'კომუნალური';
    case 'tax':  return 'გადასახადი';
    case 'chance': return 'შანსი';
    case 'chest': return 'საზოგადოებრივი ყუთი';
    case 'go': return 'დასაწყისი';
    case 'jail': return 'ციხე';
    case 'parking': return 'უფასო პარკინგი';
    case 'gotojail': return 'გადადი ციხეში';
    default: return '';
  }
}

/* ============= RENDER ============= */
function setDiceFace(el, val){
  if(!el) return;
  const cells = el.querySelectorAll('.cell'); const on = FACE[val] || [];
  cells.forEach((c,i)=>c.classList.toggle('on', on.includes(i)));
}
function renderDice(){
  if(!S) return;
  setDiceFace($('dice1'), S.dice[0]);
  setDiceFace($('dice2'), S.dice[1]);
}

function renderTimer(){
  const el = $('timerBar');
  if(!el || !S) return;
  const t = S.timeLeft || 0;
  el.textContent = `⏱ ${formatTime(t)}`;
  el.classList.toggle('warning', t <= 60);
}

function renderPlayers(){
  const el = $('players'); if(!el || !S) return;
  el.innerHTML = '';
  S.players.forEach((p,i)=>{
    const c = document.createElement('div');
    c.className = 'pcard' + (i===S.current && !S.gameOver ? ' active' : '') + (p.dead ? ' dead' : '');
    c.style.setProperty('--pc', p.color);
    c.innerHTML = `
      <div class="pd" style="background:${p.color};box-shadow:0 0 10px ${p.color}aa">${p.letter || '?'}</div>
      <div class="pn">${p.name}${p.inJail?' 🔒':''}${p.jailCards?' 🎫':''}</div>
      <div class="pm">${p.money}₾</div>
    `;
    el.appendChild(c);
  });
}

function renderTokens(){
  if(!S) return;
  S.tiles.forEach((_,i)=>{ const c=$('tokens-'+i); if(c)c.innerHTML=''; });
  const groups = {};
  S.players.forEach(p=>{ if(p.dead)return; (groups[p.pos]=groups[p.pos]||[]).push(p); });
  Object.entries(groups).forEach(([pos,arr])=>{
    const cont = $('tokens-'+pos); if(!cont)return;
    arr.forEach(p=>{
      const tk = document.createElement('div');
      tk.className = 'token';
      tk.style.background = p.color;
      tk.textContent = p.letter || '?';
      cont.appendChild(tk);
    });
  });
}

function renderOwners(){
  if(!S) return;
  S.tiles.forEach((t,i)=>{
    const el = $('tile-'+i);
    const ring = $('ring-'+i);
    if(!el||!ring) return;

    let badge = el.querySelector('.mono-badge');
    if(badge) badge.remove();

    if(t.owner != null){
      const owner = S.players[t.owner];
      el.classList.add('owned');
      ring.style.borderColor = owner.color;
      ring.style.boxShadow = `inset 0 0 0 1px rgba(255,255,255,.15), inset 0 0 20px ${owner.color}66, 0 0 10px ${owner.color}88`;
      el.style.background = `linear-gradient(160deg, ${owner.color}55 0%, ${owner.color}22 40%, #181824 95%)`;

      if(t.type === 'prop' && checkMonopoly(t.group, owner.id)) {
        const b = document.createElement('div');
        b.className = 'mono-badge';
        b.textContent = 'M';
        b.title = 'მონოპოლია (×2 ქირა)';
        el.appendChild(b);
      }
    } else {
      el.classList.remove('owned');
      ring.style.borderColor = 'transparent';
      ring.style.boxShadow = 'none';
      el.style.background = '';
    }
  });
}

function renderHouses(){
  if(!S) return;
  S.tiles.forEach((t,i)=>{
    const band = $('band-'+i); if(!band) return;
    band.querySelectorAll('.house-svg').forEach(e=>e.remove());
    if(t.type!=='prop' || t.houses===0) return;
    if(t.houses === 5){
      band.insertAdjacentHTML('beforeend', HOTEL_SVG);
    } else {
      for(let k=0;k<t.houses;k++){
        band.insertAdjacentHTML('beforeend', HOUSE_SVG);
      }
    }
    band.querySelectorAll('.house-svg').forEach(svg=>{
      svg.classList.add('new');
      setTimeout(()=>svg.classList.remove('new'), 400);
    });
  });
}

function renderTurn(){
  const el = $('turn'); if(!el || !S) return;
  if(S.gameOver){
    const alive = S.players.filter(p=>!p.dead);
    el.innerHTML = alive.length===1 ? `🏆 <b>${alive[0].name}</b> გაიმარჯვა!` : 'თამაში დასრულდა';
    return;
  }
  const p = S.players[S.current];
  const isMyTurn = S.current === myPlayerIndex;
  const hint = isMyTurn ? '👆 ხანგრძლივი დაჭერა უჯრაზე = ინფო' : '⏳ მოცდა...';
  el.innerHTML = `სვლა: <b style="color:${p.color}">${p.name}</b><span class="hint">${hint}</span>`;
}

function renderLog(){
  const el = $('log'); if(!el || !S) return;
  el.innerHTML='';
  S.logs.slice(-3).forEach(m=>{
    const d = document.createElement('div'); d.textContent = m; el.appendChild(d);
  });
}

function renderButtons(){
  const roll = $('rollBtn'), end = $('endBtn');
  if(!roll || !end) return;
  if(!S || S.gameOver || animating){
    roll.disabled = true; end.disabled = true; return;
  }
  const isMyTurn = (S.current === myPlayerIndex) && S.players[myPlayerIndex] && !S.players[myPlayerIndex].dead;
  if(!isMyTurn){
    roll.disabled = true; end.disabled = true; return;
  }
  if(S.phase==='idle'){
    roll.disabled=false; end.disabled=true;
    const p = S.players[S.current];
    if(p.inJail && p.jailCards>0) roll.textContent = '🎫 ბარათი';
    else if(p.inJail) roll.textContent = '🔓 ციხიდან';
    else roll.textContent = '🎲 გagორება';
  } else if(S.phase==='can-end'){
    roll.disabled=true; end.disabled=false;
  }
}

function renderAll(){
  if(!S) return;
  renderTimer();
  renderDice(); renderPlayers(); renderTokens(); renderOwners();
  renderHouses(); renderTurn(); renderLog(); renderButtons();
  emitSync();
}

function addLog(msg){
  if(!S) return;
  S.logs.push(msg); if(S.logs.length>60)S.logs.shift(); renderLog();
}

/* ============= STATS & GAME OVER ============= */
function computeStats(){
  return S.players.map(p => {
    let propCount = 0;
    let propertyValue = 0;
    let houseInvestment = 0;
    let housesCount = 0;
    let monopolies = 0;
    const groupsOwned = new Set();

    p.props.forEach(pos => {
      const t = S.tiles[pos];
      if(!t) return;
      propCount++;
      propertyValue += t.price || 0;
      if (t.houses > 0) {
        housesCount += t.houses;
        houseInvestment += t.houses * (HOUSE_COST[t.group] || 0);
      }
      if (t.type === 'prop') groupsOwned.add(t.group);
    });

    groupsOwned.forEach(g => {
      if (checkMonopoly(g, p.id)) monopolies++;
    });

    const totalWealth = p.money + propertyValue + houseInvestment;
    const score = totalWealth + monopolies * 500;

    return {
      player: p,
      name: p.name,
      color: p.color,
      money: p.money,
      propCount,
      propertyValue,
      houseInvestment,
      housesCount,
      monopolies,
      totalWealth,
      score,
      dead: !!p.dead
    };
  });
}

function endGame(reason){
  if(!S) return;
  if(S.gameOver && statsShown) return;
  S.gameOver = true;
  renderAll();
  emitSync();
  showStatsModal(reason);
}

function showStatsModal(reason){
  if (statsShown) return;
  statsShown = true;

  const stats = computeStats();
  stats.sort((a, b) => {
    if (a.dead !== b.dead) return a.dead ? 1 : -1;
    return b.score - a.score;
  });

  const reasonText = {
    'time_up':   '⏱ დრო ამოიწურა — გამარჯვებული განისაზღვრა ქულებით',
    'bankrupt':  '💀 გაკოტრება',
    'disconnect':'📡 მოწინააღმდეგე გავიდა',
    'all_opponents_disconnected': '📡 მოწინააღმდეგე გავიდა',
  }[reason] || 'თამაში დასრულდა';

  let html = `<h2>🏆 თამაში დასრულდა!</h2>`;
  html += `<div class="cat">${reasonText}</div>`;

  const winner = stats[0];
  if (winner && !winner.dead) {
    sfx.victory();
  } else {
    sfx.bankrupt();
  }

  stats.forEach((st, idx) => {
    const isWinner = idx === 0 && !st.dead;
    html += `<div class="stat-player${isWinner ? ' winner' : ''}">`;
    html += `<div class="stat-name">
      <span class="dot" style="background:${st.color};box-shadow:0 0 8px ${st.color}"></span>
      ${isWinner ? '👑 ' : ''}${st.name}${st.dead ? ' 💀' : ''}
    </div>`;
    html += `<div class="stat-row"><span class="lbl">💰 ბალანსი</span><span class="val">${st.money}₾</span></div>`;
    html += `<div class="stat-row"><span class="lbl">🏠 ქონება</span><span class="val">${st.propCount} (${st.propertyValue}₾)</span></div>`;
    html += `<div class="stat-row"><span class="lbl">👑 მონოპოლია</span><span class="val">${st.monopolies}</span></div>`;
    html += `<div class="stat-row"><span class="lbl">🏨 სახლები/სასტუმრო</span><span class="val">${st.housesCount}</span></div>`;
    html += `<div class="stat-row total"><span class="lbl">📊 ჯამური ქულა</span><span class="val">${st.score > 0 ? st.score : 0}</span></div>`;
    html += `</div>`;
  });

  html += `<div class="actions"><button class="btn green" onclick="location.reload()">🔄 ახალი თამაში</button></div>`;

  modalCard.className = 'mcard gameover';
  modalCard.innerHTML = html;
  modal.classList.remove('hidden');
}

/* ============= GAME FLOW ============= */
async function onRoll(){
  if(!S || animating || S.gameOver || S.phase!=='idle')return;
  if(S.current !== myPlayerIndex) return;
  sfx.roll();
  const p = S.players[S.current];

  if(p.inJail && p.jailCards > 0){
    p.jailCards--; p.inJail = false; p.jailTurns = 0;
    addLog(`${p.name} გამოიყენა 🎫 თავისუფლების ბარათი`);
    renderPlayers();
  }

  animating = true; renderButtons();
  const d1 = rand(1,6), d2 = rand(1,6);

  socket.emit('dice_roll', { roomId, d1, d2 });

  await animateDice(d1,d2);
  S.dice = [d1,d2]; S.lastRoll = d1+d2;
  const isDouble = d1 === d2;

  if(p.inJail){
    if(isDouble){
      p.inJail = false; p.jailTurns = 0;
      addLog(`${p.name} გამოვიდა ციხიდან დუბლით`);
      await animateMove(p, d1+d2); await handleLanding(p);
    } else {
      p.jailTurns++;
      if(p.jailTurns >= 3){
        p.money -= 50; p.inJail = false; p.jailTurns = 0;
        triggerMoneyAnimation(50, false);
        addLog(`${p.name} გადაიხადა 50₾ და გამოვიდა`);
        await animateMove(p, d1+d2); await handleLanding(p);
      } else {
        addLog(`${p.name} ციხეში რჩება (${p.jailTurns}/3)`);
      }
    }
    animating = false;
    if(!S.gameOver) S.phase='can-end';
    renderAll();
    checkBankrupt();
    emitSync();
    return;
  }

  addLog(`${p.name} გააგორა ${d1}+${d2}=${d1+d2}${isDouble?' 🎯':''}`);
  await animateMove(p, d1+d2);
  await handleLanding(p);
  checkBankrupt();

  if(isDouble && !S.gameOver){
    p.doubles++;
    if(p.doubles >= 3){
      addLog(`${p.name} 3 დუბლი — ციხეში!`);
      p.pos = 10; p.inJail = true; p.doubles = 0;
      renderTokens(); renderPlayers();
      animating = false; S.phase = 'can-end'; renderAll(); emitSync(); return;
    }
    addLog(`${p.name} დუბლი — კიდევ აგორებს!`);
    animating = false; S.phase = 'idle'; renderAll(); emitSync(); return;
  }

  p.doubles = 0; animating = false;
  if(!S.gameOver) S.phase='can-end';
  renderAll();
  emitSync();
}

async function animateDice(d1,d2){
  const e1 = $('dice1'), e2 = $('dice2');
  if(!e1 || !e2) return;
  e1.classList.add('shake'); e2.classList.add('shake');
  for(let i=0;i<10;i++){
    setDiceFace(e1, rand(1,6)); setDiceFace(e2, rand(1,6));
    await sleep(70);
  }
  setDiceFace(e1,d1); setDiceFace(e2,d2);
  await sleep(150);
  e1.classList.remove('shake'); e2.classList.remove('shake');
}

async function animateMove(p, steps){
  for(let s=0;s<steps;s++){
    p.pos = (p.pos+1) % 40;
    if(p.pos === 0){ 
      p.money += GO_BONUS; 
      triggerMoneyAnimation(GO_BONUS, true);
      addLog(`${p.name} გაიარა დასაწყისი +${GO_BONUS}₾`); 
    }
    renderTokens(); renderPlayers();
    emitSync();
    await sleep(220);
  }
}

async function handleLanding(p){
  const t = S.tiles[p.pos];
  addLog(`${p.name} → ${t.name}`);

  if(t.type === 'prop' || t.type === 'rail' || t.type === 'util'){
    if(t.owner === null){
      if(p.money >= t.price){
        const buy = await showBuyModal(t, p);
        if(buy){
          p.money -= t.price; t.owner = p.id; p.props.push(p.pos);
          sfx.buy();
          triggerMoneyAnimation(t.price, false);
          addLog(`${p.name} იყიდა ${t.name} ${t.price}₾`);

          if(t.type === 'prop' && checkMonopoly(t.group, p.id)){
            sfx.monopoly();
            toast(`🎉 ${p.name}-მა შეაგროვა მონოპოლია (${t.group})! ქირა გაორმაგდა!`);
            addLog(`👑 ${p.name}-მა შეაგროვა ${t.group} მონოპოლია!`);
          }

          renderOwners(); renderPlayers();
          emitSync();
        } else addLog(`${p.name} არ იყიდა ${t.name}`);
      } else { toast('არ გყოფნის ფული 💸'); }
    }
    else if(t.owner === p.id){
      if(t.type === 'prop'){
        const cost = HOUSE_COST[t.group];
        if(t.houses === 5){
          addLog(`${t.name} — 🏨 სასტუმრო უკვე აშენებულია`);
          toast('🏨 სასტუმრო უკვეა');
        } else if(p.money < cost){
          addLog(`${t.name} — არ გყოფნის ფული (${cost}₾)`);
          toast(`საჭიროა ${cost}₾ 💸`);
        } else {
          const willBuild = await showUpgradeModal(t, p, cost);
          if(willBuild){
            p.money -= cost; t.houses++;
            sfx.buy();
            triggerMoneyAnimation(cost, false);
            addLog(`${p.name} ააშენა ${t.houses===5?'🏨 სასტუმრო':'🏠 სახლი'} — ${t.name} (${cost}₾)`);
            renderHouses(); renderPlayers();
            emitSync();
          } else {
            addLog(`${p.name} არ გააუმჯობესა ${t.name}`);
          }
        }
      } else {
        addLog(`${t.name} — შენი ქონებაა`);
      }
    }
    else {
      const owner = S.players[t.owner];
      const rent = calcRent(t);
      const buyout = buyoutPrice(t);
      const canBuyout = p.money >= buyout;
      const choice = await showRentOrBuyoutModal(t, p, owner, rent, buyout, canBuyout);
      if(choice === 'buyout'){
        p.money -= buyout;
        owner.money += buyout;
        triggerMoneyAnimation(buyout, false);
        sfx.buy();
        owner.props = owner.props.filter(x => x !== p.pos);
        t.owner = p.id; t.houses = 0;
        p.props.push(p.pos);
        addLog(`${p.name} გამოისყიდა ${t.name} ${buyout}₾-ად`);

        if(t.type === 'prop' && checkMonopoly(t.group, p.id)){
          sfx.monopoly();
          toast(`🎉 ${p.name}-მა შეაგროვა მონოპოლია (${t.group})!`);
          addLog(`👑 ${p.name}-მა შეაგროვა ${t.group} მონოპოლია!`);
        }

        renderOwners(); renderHouses(); renderPlayers();
        emitSync();
      } else {
        p.money -= rent; owner.money += rent;
        triggerMoneyAnimation(rent, false);
        addLog(`${p.name} გადაიხადა ${rent}₾ → ${owner.name}`);
        renderPlayers();
        emitSync();
      }
    }
  }
  else if(t.type === 'tax'){
    p.money -= t.amount;
    triggerMoneyAnimation(t.amount, false);
    addLog(`${p.name} გადაიხადა გადასახადი ${t.amount}₾`);
    renderPlayers();
    emitSync();
  }
  else if(t.type === 'chance'){ await playCard(p,'chance'); emitSync(); }
  else if(t.type === 'chest'){ await playCard(p,'chest'); emitSync(); }
  else if(t.type === 'gotojail'){
    p.pos = 10; p.inJail = true; p.jailTurns = 0;
    addLog(`${p.name} ციხეში წავიდა! 🔒`);
    renderTokens(); renderPlayers();
    emitSync();
  }
  else if(t.type === 'parking') addLog(`დასვენება პარკინგზე 🅿️`);
  else if(t.type === 'go') addLog(`${p.name} დასაწყისზეა`);
  else if(t.type === 'jail') addLog(`უბრალოდ ციხესთან გაიარა`);
}

function calcRent(t){
  if(t.type === 'rail'){
    const owner = S.players[t.owner];
    const count = S.tiles.filter(x => x.type==='rail' && x.owner===owner.id).length;
    return [0,25,50,100,200][count];
  }
  if(t.type === 'util'){
    const owner = S.players[t.owner];
    const count = S.tiles.filter(x => x.type==='util' && x.owner===owner.id).length;
    return (count===2?10:4) * S.lastRoll;
  }
  if(t.type === 'prop'){
    const owner = S.players[t.owner];
    const ownsAll = checkMonopoly(t.group, owner.id);
    if(t.houses === 0) return ownsAll ? t.rent[0]*2 : t.rent[0];
    return t.rent[t.houses];
  }
  return 0;
}
function buyoutPrice(t){ return Math.round(t.price * 1.5 / 10) * 10; }

async function playCard(p, kind){
  const deck = kind==='chance' ? S.chanceDeck : S.chestDeck;
  const cards = kind==='chance' ? CHANCE_CARDS : CHEST_CARDS;
  const refill = () => shuffle([...Array(cards.length).keys()]);
  if(deck.length === 0) deck.push(...refill());
  const cardIdx = deck.shift();
  const card = cards[cardIdx];
  if(!card) return;
  await showCardModal(kind, card.t);
  card.f(p);
  renderTokens(); renderPlayers(); renderOwners();
  addLog(`${kind==='chance'?'❓':'📦'} ${card.t}`);
  emitSync();
}

function onEndTurn(){
  if(!S || S.gameOver || S.phase!=='can-end')return;
  if(S.current !== myPlayerIndex) return;
  S.phase = 'idle';
  const p = S.players[S.current]; p.doubles = 0;
  let next = (S.current+1) % S.players.length; let guard = 0;
  while(S.players[next].dead && guard++ < 10) next = (next+1) % S.players.length;
  S.current = next;
  addLog(`ახლა ${S.players[S.current].name}-ის სვლაა`);
  renderAll();
  emitSync();
}

function checkBankrupt(){
  let anyDead = false;
  S.players.forEach(p=>{
    if(!p.dead && p.money < 0){
      p.props.forEach(pos=>{
        const t = S.tiles[pos];
        if(t.houses > 0){ p.money += t.houses * Math.floor((HOUSE_COST[t.group]||100)/2); t.houses = 0; }
        t.owner = null;
      });
      p.props = [];
      if(p.money < 0){ 
        p.dead = true; 
        anyDead = true; 
        sfx.bankrupt();
        addLog(`💀 ${p.name} გაკოტრდა!`); 
      }
    }
  });
  if(anyDead){
    renderOwners(); renderHouses();
    emitSync();
    const alive = S.players.filter(p=>!p.dead);
    if(alive.length <= 1){
      endGame('bankrupt');
    }
  }
}

function calcRentForDisplay(t, owner){
  if(t.type === 'prop'){
    const ownsAll = owner ? checkMonopoly(t.group, owner.id) : false;
    if(t.houses === 0) return ownsAll ? t.rent[0]*2 : t.rent[0];
    return t.rent[t.houses];
  }
  if(t.type === 'rail'){
    const count = owner ? S.tiles.filter(x => x.type==='rail' && x.owner === owner.id).length : 1;
    return [0,25,50,100,200][count] || 25;
  }
  if(t.type === 'util') return '4×/10× 🎲';
  return 0;
}

function sellHouse(pos){
  const t = S.tiles[pos]; const p = S.players[S.current];
  const cost = Math.floor(HOUSE_COST[t.group]/2);
  p.money += cost; t.houses--;
  triggerMoneyAnimation(cost, true);
  addLog(`${p.name} გაყიდა სახლი — ${t.name} (+${cost}₾)`);
  renderHouses(); renderPlayers();
  emitSync();
}

/* ============= MODALS ============= */
const modal = $('modal');
const modalCard = $('modalCard');
function closeModal(){ modal.classList.add('hidden'); }

function showBuyModal(tile, player){
  return new Promise(resolve=>{
    modalCard.className = 'mcard';
    const rentPreview = calcRentForDisplay(tile, player);

    let monoText = '';
    if(tile.type === 'prop') {
      const groupTiles = S.tiles.filter(x => x.type==='prop' && x.group === tile.group);
      const ownedByP = groupTiles.filter(x => x.owner === player.id).length;
      if(ownedByP === groupTiles.length - 1) {
        monoText = `<div style="font-size:12px;color:#fbbf24;margin-top:4px;font-weight:bold;">👑 ამით შეაგროვებ მონოპოლიას! (ქირა გაორმაგდება: ${tile.rent[0]*2}₾)</div>`;
      }
    }

    modalCard.innerHTML = `
      <h2>${tile.name}</h2>
      <div class="cat">${tileTypeLabel(tile)}</div>
      ${tile.color ? `<div class="color-bar" style="background:${tile.color};color:${tile.color}"></div>` : `<div class="icon-big">${tile.icon||'🏠'}</div>`}
      <div class="price">${tile.price}₾</div>
      <div class="balance">ბალანსი: <b style="color:#fbbf24">${player.money}₾</b></div>
      <div style="font-size:13px;color:#9ca3af;margin-top:4px">საწყისი ქირა: <b style="color:#22c55e">${rentPreview}₾</b></div>
      ${monoText}
      <div class="actions">
        <button class="btn gray" id="passB">გამოტოვება</button>
        <button class="btn green" id="buyB">ყიდვა</button>
      </div>
    `;
    modal.classList.remove('hidden');
    $('buyB').onclick = ()=>{ closeModal(); resolve(true); };
    $('passB').onclick = ()=>{ closeModal(); resolve(false); };
  });
}

function showUpgradeModal(tile, player, cost){
  return new Promise(resolve=>{
    modalCard.className = 'mcard upgrade-card';
    const currentLevel = tile.houses === 0 ? 'ცარიელი ნაკვეთი'
      : tile.houses === 5 ? '🏨 სასტუმრო'
      : `🏠 ${tile.houses} სახლი`;
    const nextLevel = tile.houses === 4 ? '🏨 სასტუმრო' : `🏠 ${tile.houses+1} სახლი`;
    const nextRent = tile.rent[tile.houses+1];

    modalCard.innerHTML = `
      <h2>${tile.name}</h2>
      <div class="cat">გაუმჯობესება</div>
      <div class="color-bar" style="background:${tile.color};color:${tile.color}"></div>
      <p style="font-size:13px;color:#9ca3af;margin:6px 0">
        ამჟამინდელი: <b style="color:#f0f0f8">${currentLevel}</b>
      </p>
      <div style="font-size:15px;color:#6ee7b7;font-weight:800;margin:8px 0">
        ახალი დონე: ${nextLevel}
      </div>
      <div class="rent-row">
        <div class="lbl">ახალი ქირა:<b>ყველა მოთამაშისთვის</b></div>
        <div class="val">${nextRent}₾</div>
      </div>
      <div class="price" style="font-size:30px;margin-top:10px">${cost}₾</div>
      <div class="balance">ბალანსი: <b style="color:#fbbf24">${player.money}₾</b></div>
      <div class="actions">
        <button class="btn gray" id="passU">არა</button>
        <button class="btn green" id="buyU">აშენება</button>
      </div>
    `;
    modal.classList.remove('hidden');
    $('buyU').onclick = ()=>{ closeModal(); resolve(true); };
    $('passU').onclick = ()=>{ closeModal(); resolve(false); };
  });
}

function showRentOrBuyoutModal(tile, player, owner, rent, buyout, canBuyout){
  return new Promise(resolve=>{
    modalCard.className = 'mcard';
    modalCard.innerHTML = `
      <h2>${tile.name}</h2>
      <div class="cat">მფლობელი: <b style="color:${owner.color}">${owner.name}</b></div>
      ${tile.color ? `<div class="color-bar" style="background:${tile.color};color:${tile.color}"></div>` : `<div class="icon-big">${tile.icon||'🏠'}</div>`}
      <div class="rent-row">
        <div class="lbl">სავალდებულო ქირა:<b>გადაიხდი ავტომატურად</b></div>
        <div class="val" style="color:#ef4444">${rent}₾</div>
      </div>
      ${canBuyout ? `
      <div class="rent-row" style="margin-top:8px;border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06)">
        <div class="lbl"><b style="color:#fbbf24">გამოსყიდვის ფასი:</b>წაართვი ქონება მფლობელს</div>
        <div class="val" style="color:#fbbf24">${buyout}₾</div>
      </div>` : ''}
      <div class="balance" style="margin-top:12px">ბალანსი: <b style="color:#fbbf24">${player.money}₾</b></div>
      <div class="actions">
        <button class="btn red" id="payRentB">ქირა (${rent}₾)</button>
        ${canBuyout ? `<button class="btn orange" id="buyoutB">გამოსყიდვა (${buyout}₾)</button>` : ''}
      </div>
    `;
    modal.classList.remove('hidden');
    $('payRentB').onclick = ()=>{ closeModal(); resolve('rent'); };
    if(canBuyout){
      $('buyoutB').onclick = ()=>{ closeModal(); resolve('buyout'); };
    }
  });
}

function showCardModal(kind, text){
  return new Promise(resolve=>{
    modalCard.className = `mcard ${kind==='chance'?'chance-card':'chest-card'}`;
    modalCard.innerHTML = `
      <h2>${kind==='chance'?'❓ შანსი':'📦 საზოგადოებრივი ყუთი'}</h2>
      <div class="icon-big">${kind==='chance'?'❓':'📦'}</div>
      <p style="font-size:16px;font-weight:700;margin:16px 0;line-height:1.4">${text}</p>
      <div class="actions">
        <button class="btn green" id="cardOk">გასაგებია</button>
      </div>
    `;
    modal.classList.remove('hidden');
    $('cardOk').onclick = ()=>{ closeModal(); resolve(); };
  });
}
</script>
